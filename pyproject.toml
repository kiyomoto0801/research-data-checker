[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "research-data-checker"
version = "0.1.0"
description = "A lightweight CLI for descriptive statistics and common research-data quality checks."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kosei Kiyomoto" }]
keywords = ["research", "data-quality", "descriptive-statistics", "pandas"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
research-data-checker = "research_data_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=research_data_checker --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["research_data_checker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
